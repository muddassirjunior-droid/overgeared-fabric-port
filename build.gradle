plugins {
    id 'fabric-loom' version '1.7.4'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    // Fabric compat repos to be added as each integration is ported:
    // maven { url 'https://maven.theillusivec4.top/' }        // Curios (Fabric)
    // maven { url 'https://maven.wispforest.io' }             // Accessories
    // maven { url 'https://maven.valkyrienskies.org' }        // Valkyrien Skies
    // maven { url 'https://maven.blamejared.com' }            // JEI
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

fabricApi {
    configureDataGeneration()
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 17 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

loom {
    accessWidenerPath = file("src/main/resources/overgeared.accesswidener")
}
